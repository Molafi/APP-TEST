name: plantsense_ai
description: PlantSense AI — an intelligent plant and soil assistant with AI chat, image diagnosis, and weather-aware plant care.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  google_sign_in: ^6.2.1

  # Networking
  http: ^1.2.2
  connectivity_plus: ^6.0.5

  # Camera and images
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  image: ^4.2.0
  image_cropper: ^8.0.2

  # AI accessibility (voice)
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  # Sharing & home-screen widget
  share_plus: ^10.1.2
  home_widget: ^0.7.0

  # Optional, opt-in analytics & crash reporting (no-op unless enabled)
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3

  # Location and permissions
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # Local data and utilities
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  uuid: ^4.5.1
  package_info_plus: ^8.0.2

  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/svg/
