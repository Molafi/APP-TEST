name: Flutter CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches-ignore: ["main"]

# Minimal permissions — the workflow only reads the repo.
permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned rather than floating on `channel: stable`: the repo is
          # formatted with the Dart 3.9 tall-style formatter and the
          # `dart format --set-exit-if-changed` gate below would break whenever
          # stable's formatter changes. 3.35 is also the floor required by
          # RadioGroup in settings_screen.dart.
          flutter-version: "3.35.x"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # Scoped to the source directories rather than `.` on purpose. A bare
      # `dart format .` walks build/ too, and once anyone has run a Gradle build
      # locally that directory contains transform folders whose paths break
      # directory listing on Windows:
      #   PathNotFoundException: Directory listing failed, path =
      #   '.\build\cloud_firestore\.transforms\...'
      # So the command CI enforced could not be run locally by the developers
      # expected to satisfy it. These three directories are all the Dart there
      # is, so nothing is lost by naming them.
      - name: Verify formatting
        id: format
        run: |
          dart format --output=none --set-exit-if-changed \
            lib test integration_test

      # `dart format` only names the files it would change, which is not enough
      # to fix them from a log. Printing the diff makes the failure actionable
      # without having to reproduce it locally first.
      - name: Show the required formatting
        if: ${{ failure() && steps.format.outcome == 'failure' }}
        run: |
          dart format lib test integration_test
          git --no-pager diff

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --no-pub

  functions-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Cloud Functions
        working-directory: functions
        run: |
          npm ci || npm install
          npm run build
